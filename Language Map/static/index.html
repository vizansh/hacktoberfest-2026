<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Map</title>
<style>
:root {
  --ink: #111111;
  --muted: #6b6b6b;
  --line: #e8e8e8;
  --paper: #ffffff;
  --blue: #315efb;
  --blue-soft: #f1f4ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

main {
  width: min(1080px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 32px 28px 72px;
}

header {
  border-bottom: 1px solid var(--line);
  padding-bottom: 24px;
}

.logo {
  font-size: 21px;
  font-weight: 750;
  letter-spacing: -0.03em;
}

.intro {
  max-width: 620px;
  margin: 112px 0 72px;
}

.intro h1 {
  max-width: 540px;
  margin: 0;
  font-size: clamp(42px, 7vw, 76px);
  line-height: 0.98;
  letter-spacing: -0.065em;
  font-weight: 750;
}

.intro p {
  max-width: 490px;
  margin: 24px 0 0;
  color: var(--muted);
  font-size: 18px;
}

.sections {
  display: grid;
  grid-template-columns: 1.25fr 1fr 0.85fr;
  gap: 16px;
}

.section {
  min-height: 220px;
  padding: 26px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
  text-align: left;
  color: inherit;
  text-decoration: none;
  transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
}

.section:hover {
  border-color: #b9c7ff;
  background: var(--blue-soft);
  transform: translateY(-2px);
}

.section h2 {
  margin: 42px 0 10px;
  font-size: clamp(24px, 3vw, 32px);
  letter-spacing: -0.045em;
}

.section p {
  margin: 0;
  color: var(--muted);
}

@media (max-width: 760px) {
  main { padding: 24px 20px 48px; }
  .intro { margin: 80px 0 48px; }
  .sections { grid-template-columns: 1fr; }
  .section { min-height: 160px; }
  .section h2 { margin-top: 18px; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">Language Map</div>
  </header>

  <section class="intro" aria-labelledby="welcome-title">
    <h1 id="welcome-title">See how languages connect.</h1>
    <p>Explore words, phrases, and patterns across language families.</p>
  </section>

  <section class="sections" aria-label="Learning sections">
    <a class="section" href="/word" target="_blank" rel="noopener">
      <h2>Words</h2>
      <p>Follow one word across related languages.</p>
    </a>
    <a class="section" href="/phrases" target="_blank" rel="noopener" onclick="window.open('/phrases', '_blank', 'noopener'); return false;">
      <h2>Phrases</h2>
      <p>Compare how ideas are shaped into sentences.</p>
    </a>
    <a class="section time-card" href="/time" target="_blank" rel="noopener" onclick="window.open('/time', '_blank', 'noopener'); return false;">
      <h2>Across time</h2>
      <p>Turn a paragraph into today’s language.</p>
    </a>
  </section>
</main>
</body>
</html>
