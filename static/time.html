<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Across time · Language Map</title>
<style>
:root{--ink:#111;--muted:#6b6b6b;--line:#e8e8e8;--blue:#315efb;--blue-soft:#f1f4ff}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(980px,100%);margin:auto;padding:32px 28px 72px}
header{border-bottom:1px solid var(--line);padding-bottom:24px}.logo{font-size:21px;font-weight:750;letter-spacing:-.03em}
.intro{margin:72px 0 34px}.intro h1{margin:0;font-size:clamp(40px,7vw,68px);line-height:1;letter-spacing:-.06em}.intro p{color:var(--muted);font-size:18px;margin:18px 0 0}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff}.panel h2{margin:0 0 12px;font-size:21px;letter-spacing:-.03em}
textarea{width:100%;min-height:260px;padding:13px;border:1px solid var(--line);border-radius:10px;resize:vertical;font:inherit;color:var(--ink)}
button{margin-top:16px;padding:13px 18px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.status{min-height:27px;margin:18px 0;color:var(--muted)}.error{color:#b42318}
.output{min-height:260px;padding:13px;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap;color:var(--muted)}
.time-card{position:relative;overflow:hidden;background:linear-gradient(120deg,#eef2ff,#fff 42%,#eaf8f5,#fff 75%);background-size:260% 260%;animation:liquid 8s ease-in-out infinite}
.time-card:after{content:"";position:absolute;width:140px;height:140px;right:-42px;bottom:-60px;border-radius:50%;background:#315efb30;animation:ripple 4s ease-out infinite}
@keyframes liquid{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes ripple{0%{transform:scale(.7);opacity:.25}70%,100%{transform:scale(1.7);opacity:0}}
@media(max-width:700px){main{padding:24px 20px 48px}.intro{margin-top:56px}.blocks{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header><div class="logo">Language Map</div></header>
  <section class="intro">
    <h1>Across time.</h1>
    <p>Bring an older paragraph into language that feels current.</p>
  </section>
  <form id="rewrite">
    <div class="blocks">
      <section class="panel">
        <h2>Your paragraph</h2>
        <textarea id="source" maxlength="500" placeholder="Paste up to 500 characters here."></textarea>
      </section>
      <section class="panel">
        <h2>Modern version</h2>
        <div class="output" id="output" aria-live="polite">Your rewrite will appear here.</div>
      </section>
    </div>
    <button type="submit">Make it current</button>
  </form>
  <div class="status" id="status" aria-live="polite"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#rewrite').addEventListener('submit',async event=>{event.preventDefault();const source=$('#source').value.trim();if(!source){$('#status').textContent='Paste a paragraph to begin.';return}$('#status').textContent='Gemma is rewriting it…';$('#output').textContent='';try{const r=await fetch('/api/time?'+new URLSearchParams({text:source}));const data=await r.json();if(!r.ok)throw new Error(data.error);$('#output').textContent=data.modern_text;$('#status').textContent=''}catch(e){$('#status').innerHTML=`<span class="error">${esc(e.message)}</span>`}});
</script>
</body>
</html>
